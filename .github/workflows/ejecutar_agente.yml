name: Agente Verificador de Leads Odoo

on:
  schedule:
    # 4 corridas por dia (UTC 00, 06, 12, 18).
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

concurrency:
  group: verificador-leads-odoo
  cancel-in-progress: false

jobs:
  verificar-leads:
    runs-on: ubuntu-latest
    # Tope duro. El script se corta solo a las 3h30m y termina en verde;
    # este limite es solo una red de seguridad por si algo se cuelga.
    timeout-minutes: 240
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v5
      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
      - name: Ejecutar auditoria Gemini y DuckDuckGo
        env:
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_USER: ${{ secrets.ODOO_USER }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agente_leads.py
