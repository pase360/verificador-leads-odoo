name: Agente Verificador de Leads Odoo

on:
  schedule:
    # Una ejecución diaria, después de la ventana habitual del buscador de leads.
    - cron: '0 16 * * *'
  workflow_dispatch: # Permite ejecución manual controlada.

# Evita dos verificaciones simultáneas que dupliquen consumo de Gemini.
concurrency:
  group: verificador-leads-odoo
  cancel-in-progress: false

jobs:
  verificar-leads:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar Agente de Leads
        env:
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_USER: ${{ secrets.ODOO_USER }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agente_leads.py
